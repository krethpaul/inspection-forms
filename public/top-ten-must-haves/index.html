<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Top Ten Must-Haves</title>
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#f3f3fe;color:#2c3345;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45}
  .ttm-logo{display:flex;justify-content:center;padding:24px 16px 20px}
  .ttm-logo img{display:block;width:190px;max-width:60%;height:auto;border-radius:4px}
  .ttm-card{max-width:752px;margin:0 auto 48px;background:#fff;border-radius:3px;box-shadow:0 4px 4px rgba(87,100,126,.21)}
  .ttm-head{text-align:center;padding:40px 52px 28px;border-bottom:1px solid #d7d8e1}
  .ttm-head h1{margin:0;font-size:28px;line-height:1.25;font-weight:500;text-wrap:balance}
  .ttm-head p{margin:6px 0 0;font-size:14px;color:#57647e}
  form{padding:16px 52px 0}
  .ttm-f{padding:12px 0}
  .ttm-f label{display:block;font-weight:500;margin-bottom:9px}
  .ttm-f input{display:block;width:310px;max-width:100%;height:40px;padding:0 10px;font:inherit;color:inherit;background:#fff;border:1px solid #b8bdc9;border-radius:4px;-webkit-appearance:none;appearance:none}
  .ttm-f input:hover{border-color:#2e69ff}
  .ttm-f input:focus{outline:none;border-color:#2e69ff;box-shadow:0 0 0 3px #c9d8fe}
  .ttm-name{display:flex;gap:12px;max-width:480px}
  .ttm-name>div{flex:1;min-width:0}
  .ttm-name input{width:100%}
  .ttm-sub{display:block;margin-top:6px;font-size:12px;font-weight:400;color:#57647e}
  .ttm-req{color:#f23a3c;margin-left:3px}
  .ttm-f input.ttm-bad{border-color:#f23a3c;box-shadow:0 0 0 3px #ffd6d6}
  .ttm-hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
  .ttm-foot{margin:20px -52px 0;padding:24px 52px 28px;border-top:1px solid #d7d8e1;text-align:center}
  .ttm-btn{min-width:180px;height:48px;padding:0 24px;font:inherit;font-weight:500;color:#fff;background:#18bd5b;border:1px solid #18bd5b;border-radius:4px;cursor:pointer}
  .ttm-btn:hover{background:#16aa52;border-color:#16aa52}
  .ttm-btn:focus-visible{outline:3px solid #c9d8fe;outline-offset:2px}
  .ttm-btn[disabled]{opacity:.6;cursor:default}
  .ttm-msg{display:none;margin:0 0 16px;padding:11px 14px;border-radius:4px;background:#ffeded;color:#b3261e;font-size:15px;text-align:left}
  .ttm-msg.on{display:block}
  .ttm-done{display:none;text-align:center;padding:64px 32px 72px}
  .ttm-done h2{margin:0 0 8px;font-size:30px;font-weight:500}
  .ttm-done p{margin:0;color:#57647e}
  .ttm-check{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:#18bd5b;display:flex;align-items:center;justify-content:center}
  .ttm-check svg{width:36px;height:36px}
  .ttm-sent .ttm-head,.ttm-sent form{display:none}
  .ttm-sent .ttm-done{display:block}
  @media (max-width:600px){
    .ttm-name{max-width:none}
    .ttm-card{margin:0 0 0;border-radius:0;box-shadow:none;min-height:70vh}
    .ttm-head{padding:28px 20px 22px}
    .ttm-head h1{font-size:24px}
    form{padding:10px 20px 0}
    .ttm-f input{width:100%;height:46px}
    .ttm-foot{margin:16px -20px 0;padding:20px}
    .ttm-btn{width:100%}
    body{background:#fff}
    .ttm-logo{background:#f3f3fe}
  }
</style>
</head>

<script>
(function(){
  var form=document.getElementById('ttmForm'),btn=document.getElementById('ttmBtn'),
      msg=document.getElementById('ttmMsg'),card=document.getElementById('ttmCard'),
      done=document.getElementById('ttmDone'),busy=false,
      first=document.getElementById('ttmFirst'),last=document.getElementById('ttmLast');
  function say(t){msg.textContent=t;msg.className='ttm-msg'+(t?' on':'');}
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(busy)return;
    var any=false,ins=form.querySelectorAll('.ttm-f input'),nm=[first,last],bad=null;
    for(var i=0;i<ins.length;i++){ins[i].value=ins[i].value.trim();if(ins[i].value&&nm.indexOf(ins[i])<0)any=true;}
    if(!any){say('Please fill in at least one must-have before submitting.');ins[0].focus();return;}
    for(var j=0;j<nm.length;j++){var ok=!!nm[j].value;nm[j].classList.toggle('ttm-bad',!ok);nm[j].setAttribute('aria-invalid',ok?'false':'true');if(!ok&&!bad)bad=nm[j];}
    if(bad){say('Please enter your first and last name before submitting.');bad.focus();return;}
    say('');busy=true;btn.disabled=true;btn.textContent='Sending…';
    fetch(form.action,{method:'POST',body:new URLSearchParams(new FormData(form))})
      .then(function(r){
        if(r.ok){card.className='ttm-card ttm-sent';done.focus();window.scrollTo(0,0);return;}
        throw new Error('error '+r.status);
      })
      .catch(function(err){
        busy=false;btn.disabled=false;btn.textContent='Submit';
        var d=/^error \d+$/.test(err.message)?' ('+err.message+')':'';
        say('Your answers could not be sent'+d+'. Please check your connection and try again.');
      });
  });
})();
</script>
